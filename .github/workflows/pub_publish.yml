name: Pub publish

on:
  push:
    tags: ['pub-telosnex_excel-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/pub_publish.yml@0ab334b66d7bb8ff0f436b8e9739eb014ab35b79 # v0.5.24
    permissions:
      contents: write
      id-token: write
    with:
      test: dart test
      max-lost-points: 0
