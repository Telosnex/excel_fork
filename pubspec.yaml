name: excel
description: Read, create and edit Excel XLSX workbooks in Dart and Flutter. Supports typed cells, formulas, styles and multiple worksheets.
version: 5.0.0
repository: https://github.com/Telosnex/excel_fork
issue_tracker: https://github.com/Telosnex/excel_fork/issues
topics:
  - excel
  - office
  - storage
  - sheets
  - spreadsheet

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  web: ^1.1.1
  archive: ^4.0.4
  xml: ">=6.6.1 <8.0.0"
  collection: ^1.15.0
  equatable: ">=2.0.0 <4.0.0"

dev_dependencies:
  test: ^1.23.0
  lints: ^5.1.1
